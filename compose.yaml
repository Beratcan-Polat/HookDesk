name: hookdesk
x-app: &app
  build:
    context: .
    dockerfile: infra/docker/backend.Dockerfile
    target: development
  env_file: .env
  volumes:
    - ./backend:/srv/backend
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped
  networks: [backend, outbound]
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-hookdesk}
      POSTGRES_USER: ${DB_USERNAME:-hookdesk}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes: [postgres_data:/var/lib/postgresql]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]
  redis:
    image: redis:8-alpine
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    volumes: [redis_data:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]
  app:
    <<: *app
  worker:
    <<: *app
    command: php artisan queue:work redis --queue=deliveries,default --timeout=20 --tries=1 --sleep=1
  scheduler:
    <<: *app
    command: php artisan schedule:work
  receiver:
    <<: *app
    environment:
      APP_ROLE: receiver
    command: php artisan serve --host=0.0.0.0 --port=8080
    networks: [backend]
  frontend-dev:
    image: node:24-alpine
    working_dir: /frontend
    volumes:
      - ./frontend:/frontend
      - frontend_modules:/frontend/node_modules
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      API_PROXY_TARGET: http://gateway
    networks: [backend, outbound]
  gateway:
    image: caddy:2-alpine
    ports: ['127.0.0.1:8080:80']
    volumes:
      - ./infra/caddy/development.Caddyfile:/etc/caddy/Caddyfile:ro
      - ./backend/public:/srv/backend/public:ro
    depends_on: [app, frontend-dev]
    networks: [backend, outbound]
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ['127.0.0.1:8025:8025']
    networks: [backend]
networks:
  backend:
    internal: true
  outbound: {}
volumes:
  postgres_data: {}
  redis_data: {}
  frontend_modules: {}
